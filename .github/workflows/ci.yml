name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      TWILIO_TEST_ACCOUNT_SID: ""
      TWILIO_TEST_AUTH_TOKEN: "test-auth-token"

    strategy:
      fail-fast: false
      matrix:
        elixir_version: [1.18.5, 1.19.6, 1.20.4]
        otp_version: [27, 28, 29]
        exclude:
          - elixir_version: 1.18.5
            otp_version: 28
          - elixir_version: 1.18.5
            otp_version: 29
          - elixir_version: 1.19.6
            otp_version: 29
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp_version}}
          elixir-version: ${{matrix.elixir_version}}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp_version }}-${{ matrix.elixir_version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp_version }}-${{ matrix.elixir_version }}
      - run: mix deps.get

      - run: mix format --check-formatted

      - run: mix deps.unlock --check-unused

      - run: mix deps.compile

      - run: mix compile --warnings-as-errors

      - run: mix dialyzer

      - run: mix credo --strict --format=oneline

      - run: mix test --warnings-as-errors --cover
